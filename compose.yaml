services:
  app:
    image: node:22-alpine
    container_name: ${APP_NAME}
    working_dir: /app
    command: npm run dev
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${APP_PORT}:${CONTAINER_PORT}"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
